name: Poll Kaggle leaderboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemma4-leaderboard-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Collect leaderboard snapshot
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_COMPETITION: gemma-4-developer-agent
        run: python scripts/collect.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/state.json docs/data/leaderboard.json; then
            echo "No leaderboard changes to commit."
            exit 0
          fi

          git config user.name "gemma4-leaderboard-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json docs/data/leaderboard.json
          git commit -m "chore: update leaderboard snapshot"
          git push
